<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Réservez vos places à bord avec TALA Trajet." />
  <meta name="theme-color" content="#0b1018" />

  <title>TALA Trajet — Réservation</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;850;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg: #0b1018;
      --bg-soft: #111923;
      --surface: #151e2a;
      --surface-2: #1b2634;
      --border: #2a394b;
      --text: #f5f8fc;
      --muted: #a8b5c5;
      --primary: #25a5ff;
      --primary-2: #00d7c8;
      --success: #35d07f;
      --warning: #ffbf55;
      --danger: #ff6b6b;
      --shadow: 0 20px 60px rgba(0, 0, 0, .28);
      --radius: 18px;
      --container: 1160px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 50% -10%, rgba(37, 165, 255, .16), transparent 35rem),
        var(--bg);
      font-family: 'Poppins', Inter, ui-sans-serif, system-ui, sans-serif;
      line-height: 1.6;
    }

    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    img { max-width: 100%; display: block; }
    .container { width: min(var(--container), calc(100% - 40px)); margin-inline: auto; }

    /* HEADER */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid rgba(255,255,255,.08);
      background: rgba(11,16,24,.88);
      backdrop-filter: blur(16px);
    }
    .header-inner { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { font-weight: 900; font-size: 1.4rem; letter-spacing: -.05em; color: var(--primary); }
    .brand span { color: var(--primary-2); }
    
    .main-content { max-width: 720px; margin: 36px auto 60px; padding: 0 20px; }

    .card {
      background: linear-gradient(145deg, var(--surface), #111a25);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }

    .bus-wrapper {
      background: linear-gradient(145deg, var(--surface), #111a25);
      padding: 28px 20px 32px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      margin: 24px 0;
    }

    .bus-front {
      width: 100%;
      max-width: 340px;
      margin: 0 auto 24px;
      padding-bottom: 16px;
      border-bottom: 1px dashed var(--border);
      text-align: center;
    }

    .driver-area {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 650;
      margin-bottom: 10px;
    }

    .driver-area svg {
      width: 16px;
      height: 16px;
      color: var(--primary);
    }

    .entrance {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--success);
      font-size: 0.78rem;
      font-weight: 650;
    }

    .entrance svg { width: 15px; height: 15px; }

    .legend {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 24px;
      font-size: 13px;
      font-weight: 650;
      color: var(--text);
    }

    .legend-item { display: flex; align-items: center; gap: 8px; }
    .dot { width: 14px; height: 14px; border-radius: 4px; }
    .dot.occupied { background: var(--danger); }
    .dot.selected { background: var(--success); }
    .dot.free { background: var(--border); border: 1px solid #485b74; }

    .bus-layout {
      width: 100%;
      max-width: 340px;
      margin: auto;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }

    .seats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr) 35px repeat(2, 1fr);
      gap: 10px;
      align-items: center;
    }

    .seat {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 12px;
      color: var(--text);
      transition: all 0.2s ease;
    }

    .seat:hover:not(.unavailable) {
      transform: scale(1.06);
      border-color: var(--primary);
    }

    .seat.selected {
      background-color: var(--success);
      color: #03131c;
      border-color: var(--success);
    }

    .seat.unavailable {
      background-color: var(--danger);
      color: white;
      cursor: not-allowed;
      border: none;
      opacity: 0.8;
    }

    .aisle { grid-column: 3; }

    .last-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-top: 12px;
      padding-top: 14px;
      border-top: 1px dashed var(--border);
    }

    .total-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-top: 18px;
      font-weight: 750;
      color: var(--text);
    }

    .price {
      color: var(--primary);
      font-size: 1.25rem;
      letter-spacing: -.02em;
    }

    button[type="submit"] {
      width: 100%;
      min-height: 52px;
      padding: 0 20px;
      background: linear-gradient(120deg, #45c0ff, #00d7c8);
      color: #03131c;
      border: none;
      border-radius: 11px;
      font-weight: 850;
      cursor: pointer;
      margin-top: 18px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-size: 1rem;
      box-shadow: 0 4px 15px rgba(0, 215, 200, 0.2);
    }

    button[type="submit"]:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
      box-shadow: 0 8px 25px rgba(0, 215, 200, 0.4);
    }

    .form input {
      width: 100%;
      padding: 13px 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--bg);
      color: var(--text);
      font-size: .95rem;
      outline: none;
    }

    .form input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,165,255,.15);
    }

    .phone-container {
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 11px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .phone-container:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,165,255,.15);
    }

    .phone-prefix {
      padding: 0 14px;
      color: var(--muted);
      font-family: monospace;
      font-size: .95rem;
      user-select: none;
      border-right: 1px solid var(--border);
    }

    .phone-container input {
      margin-bottom: 0 !important;
      border: none !important;
      background: transparent !important;
      box-shadow: none !important;
    }

    .info-icon, .section-icon { width: 18px; height: 18px; vertical-align: -3px; margin-right: 6px; color: var(--primary); }

    @media (max-width: 480px) {
      .main-content { padding: 0 14px; }
      .card { padding: 20px; }
      .bus-wrapper { padding: 20px 10px 24px; }
    }
  </style>
</head>

<body>

<header class="site-header">
  <div class="container header-inner">
    <div class="brand">TALA<span>Trajet</span></div>
    <a href="javascript:history.back()" style="color:var(--muted);text-decoration:none;font-size:0.9rem;display:inline-flex;align-items:center;gap:6px;">
      <i data-lucide="arrow-left" style="width:16px;height:16px;"></i> Retour
    </a>
  </div>
</header>

<main class="main-content">

  <section id="tripDetails" class="card">
    <p style="text-align:center;color:var(--muted);">
      <i data-lucide="loader-circle" class="icon" style="animation: spin 1s linear infinite;"></i> Chargement des détails du voyage...
    </p>
  </section>

  <h3 style="color:#ffffff;font-size:1.15rem;margin-top:30px;display:flex;align-items:center;gap:8px;">
    <i data-lucide="armchair" class="section-icon"></i> Choisissez vos sièges
  </h3>

  <div class="bus-wrapper">
    <div class="legend">
      <div class="legend-item"><div class="dot free"></div><span>Libre</span></div>
      <div class="legend-item"><div class="dot selected"></div><span>Choisi</span></div>
      <div class="legend-item"><div class="dot occupied"></div><span>Occupé</span></div>
    </div>

    <div class="bus-front">
      <div class="driver-area"><i data-lucide="steering-wheel"></i> Chauffeur</div>
      <div class="entrance"><i data-lucide="door-open"></i> Entrée</div>
    </div>

    <div class="bus-layout">
      <div id="seatsContainer" class="seats-grid"></div>
    </div>
  </div>

  <form id="bookingForm" class="form card">
    <h3 style="color:#ffffff;font-size:1.15rem;margin-top:0;margin-bottom:20px;display:flex;align-items:center;gap:8px;">
      <i data-lucide="user-round" class="section-icon"></i> Vos informations de voyage
    </h3>

    <div style="margin-bottom: 6px; font-size: 0.82rem; color: var(--muted); font-weight: 700;">Nom et prénom du passager</div>
    <input type="text" id="name" name="name" placeholder="Ex: Jean Kabasele" required>

    <div style="margin-bottom: 6px; font-size: 0.82rem; color: var(--muted); font-weight: 700;">Adresse e-mail</div>
    <input type="email" id="email" name="email" placeholder="votre.email@example.com" required>
    
    <div style="margin-bottom: 6px; font-size: 0.82rem; color: var(--muted); font-weight: 700;">Numéro de téléphone</div>
    <div class="phone-container">
      <span class="phone-prefix">+243</span>
      <input type="tel" id="phone" name="phone" placeholder="81 234 5678" required>
    </div>

    <div class="total-bar">
      <span>
        <i data-lucide="armchair" class="info-icon"></i> <span id="remainingCount">0</span> restantes
      </span>
      <span id="totalPrice" class="price">0 FC</span>
    </div>

    <button type="submit" id="submitBtn">
      <i data-lucide="credit-card" style="width:18px;height:18px;vertical-align:-3px;margin-right:6px;"></i> Procéder au paiement
    </button>
  </form>

</main>

<script>
  const { createClient } = window.supabase;
  const supabaseUrl = "https://kfkifkstatbadtzosxai.supabase.co";
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtma2lma3N0YXRiYWR0em9zeGFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3MTYzMTAsImV4cCI6MjEwMTI5MjMxMH0.xPzFtl_OET2asSc5iH3liRHnPyuUYAfbbjZISwfnaA8";
  const supabaseClient = createClient(supabaseUrl, supabaseKey);

  const params = new URLSearchParams(window.location.search);
  const trajetId = params.get("trip_id") || params.get("trajet_id");

  let selectedSeats = [];
  let trajet = null;
  let currentUserId = null;
  let totalCapacity = 57;
  let occupiedSeatsCount = 0;

  function formatDate(dateString) {
    if (!dateString) return '';
    const cleanDate = dateString.split('T')[0];
    const parts = cleanDate.split('-');
    if (parts.length === 3) {
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }
    return dateString;
  }

  async function loadTrip() {
    if (!trajetId) {
      alert("Aucun trajet sélectionné.");
      window.location.href = "index.html";
      return;
    }

    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session || !session.user) {
      alert("Vous devez être connecté à votre compte pour réserver un trajet.");
      window.location.href = "auth.html";
      return;
    }

    currentUserId = session.user.id;
    if (session.user.user_metadata?.full_name) {
      document.getElementById("name").value = session.user.user_metadata.full_name;
    }
    if (session.user.email) {
      document.getElementById("email").value = session.user.email;
    }

    const { data, error } = await supabaseClient
      .from("trips")
      .select(`
        id,
        ville_depart,
        ville_arrivee,
        date_depart,
        prix,
        places_totales,
        places_disponibles,
        agency:agencies!left ( id, nom )
      `)
      .eq("id", trajetId)
      .maybeSingle();

    if (error || !data) {
      alert("Impossible de charger les détails du trajet.");
      window.location.href = "index.html";
      return;
    }

    trajet = data;

    const { data: reservedData } = await supabaseClient
      .from("reservations")
      .select("seats")
      .eq("trip_id", trajetId);

    let occupiedSeats = [];
    if (reservedData) {
      reservedData.forEach(r => {
        if (r.seats) {
          try {
            const list = Array.isArray(r.seats) ? r.seats : JSON.parse(r.seats);
            occupiedSeats = occupiedSeats.concat(list.map(Number));
          } catch (e) {
            console.error("Erreur parsing sièges:", e);
          }
        }
      });
    }

    totalCapacity = trajet.places_totales ? Number(trajet.places_totales) : 57;
    occupiedSeatsCount = occupiedSeats.length;
    const remainingSeats = trajet.places_disponibles !== null ? trajet.places_disponibles : (totalCapacity - occupiedSeatsCount);

    document.getElementById("remainingCount").textContent = remainingSeats;

    document.getElementById("tripDetails").innerHTML = `
      <h3 style="margin-top:0; color:var(--primary-2); font-size:1.25rem;">
        <i data-lucide="map-pin" class="info-icon"></i> ${trajet.ville_depart} <span style="color:#ffffff;">➔</span> ${trajet.ville_arrivee}
      </h3>
      <p style="margin:8px 0; color:var(--muted); font-size:.9rem;">
        <i data-lucide="building-2" class="info-icon"></i> <strong>Compagnie :</strong> ${trajet.agency ? trajet.agency.nom : 'Agence Partenaire'}
      </p>
      <p style="margin:8px 0; color:var(--muted); font-size:.9rem;">
        <i data-lucide="calendar-days" class="info-icon"></i> <strong>Date de départ :</strong> ${formatDate(trajet.date_depart)}
      </p>
      <p style="margin:8px 0; color:var(--muted); font-size:.9rem;">
        <i data-lucide="banknote" class="info-icon"></i> <strong>Prix :</strong> ${Number(trajet.prix).toLocaleString('fr-FR')} FC / place
      </p>
      <p style="margin:8px 0 0 0; color:var(--success); font-weight:650; font-size:.9rem;">
        <i data-lucide="armchair" class="info-icon"></i> <strong>Places restantes :</strong> ${remainingSeats} sur ${totalCapacity}
      </p>
    `;

    lucide.createIcons();
    generateSeats(totalCapacity, occupiedSeats);
  }

  function generateSeats(totalSeats, occupiedSeats) {
    const container = document.getElementById("seatsContainer");
    if (!container) return;

    container.innerHTML = "";

    const normalSeatsLimit = totalSeats > 5 ? totalSeats - 5 : totalSeats;

    for (let i = 1; i <= normalSeatsLimit; i++) {
      const seat = document.createElement("div");
      seat.classList.add("seat");
      seat.textContent = i.toString().padStart(2, "0");

      if (occupiedSeats.includes(i)) {
        seat.classList.add("unavailable");
      } else {
        seat.addEventListener("click", () => toggleSeat(i, seat));
      }

      container.appendChild(seat);

      if (i % 2 === 0 && i % 4 !== 0) {
        const aisle = document.createElement("div");
        aisle.classList.add("aisle");
        container.appendChild(aisle);
      }
    }

    if (totalSeats > normalSeatsLimit) {
      const lastRow = document.createElement("div");
      lastRow.classList.add("last-row");

      for (let i = normalSeatsLimit + 1; i <= totalSeats; i++) {
        const seat = document.createElement("div");
        seat.classList.add("seat");
        seat.textContent = i.toString().padStart(2, "0");

        if (occupiedSeats.includes(i)) {
          seat.classList.add("unavailable");
        } else {
          seat.addEventListener("click", () => toggleSeat(i, seat));
        }

        lastRow.appendChild(seat);
      }

      container.appendChild(lastRow);
    }
  }

  function toggleSeat(seatNumber, seatDiv) {
    if (!trajet || !trajet.prix) return;

    if (selectedSeats.includes(seatNumber)) {
      selectedSeats = selectedSeats.filter(s => s !== seatNumber);
      seatDiv.classList.remove("selected");
    } else {
      selectedSeats.push(seatNumber);
      seatDiv.classList.add("selected");
    }

    const baseRemaining = totalCapacity - occupiedSeatsCount;
    const currentRemaining = baseRemaining - selectedSeats.length;

    document.getElementById("remainingCount").textContent = currentRemaining;
    document.getElementById("totalPrice").textContent =
      (selectedSeats.length * Number(trajet.prix)).toLocaleString('fr-FR') + " FC";
  }

  document.getElementById("bookingForm").addEventListener("submit", (e) => {
    e.preventDefault();

    if (selectedSeats.length === 0) {
      alert("Veuillez sélectionner au moins un siège sur le plan de bus.");
      return;
    }

    const formData = new FormData(e.target);
    const totalAmount = selectedSeats.length * Number(trajet.prix);

    const rawPhone = formData.get("phone").trim();
    const fullPhone = "+243" + rawPhone.replace(/\s+/g, '');

    const reservationInfoToSave = {
      trip_id: trajetId,
      user_id: currentUserId,
      nom_client: formData.get("name"),
      email: formData.get("email"),
      telephone_client: fullPhone,
      seats: selectedSeats,
      seats_count: selectedSeats.length,
      total_price: totalAmount,
      ville_depart: trajet.ville_depart,
      ville_arrivee: trajet.ville_arrivee,
      agence: trajet.agency ? trajet.agency.nom : 'Agence Partenaire',
      date: trajet.date_depart,
      statut: "EN_ATTENTE_PAIEMENT"
    };

    localStorage.setItem("reservationInfo", JSON.stringify(reservationInfoToSave));
    window.location.href = "payment.html";
  });

  loadTrip();
</script>

</body>
</html>
