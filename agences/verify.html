<!DOCTYPE html><html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TALA Contrôle - Scanner Billet</title>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Scanner QR -->
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
    body {
        font-family: Arial, sans-serif;
    }

    .hidden {
        display: none !important;
    }

    #reader {
        width: 100%;
        overflow: hidden;
        border-radius: 18px;
    }

    #reader video {
        border-radius: 18px;
    }

    #reader img {
        display: none !important;
    }
</style>

</head><body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4"><main class="w-full max-w-md">

    <div class="bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl p-6">

        <!-- HEADER -->
        <div class="text-center mb-6">

            <div class="text-4xl mb-2">
                🎫
            </div>

            <h1 class="text-2xl font-bold text-cyan-400">
                TALA Contrôle
            </h1>

            <p class="text-slate-400 text-sm mt-1">
                Scanner et vérifier les billets
            </p>

        </div>


        <!-- SCANNER -->

        <div
            id="scanner-container"
            class="mb-5"
        >

            <div
                id="reader"
                class="bg-slate-950 border border-slate-700"
            ></div>

            <p
                id="scanner-message"
                class="text-center text-xs text-slate-500 mt-3"
            >
                Autorisez l'accès à la caméra pour scanner le QR Code.
            </p>

        </div>


        <!-- BOUTON CAMÉRA -->

        <button
            id="camera-button"
            type="button"
            class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 rounded-xl transition-all mb-5"
        >
            📷 Démarrer le scanner
        </button>


        <!-- SÉPARATEUR -->

        <div class="flex items-center gap-3 my-5">

            <div class="h-px bg-slate-800 flex-1"></div>

            <span class="text-xs text-slate-500">
                OU
            </span>

            <div class="h-px bg-slate-800 flex-1"></div>

        </div>


        <!-- SAISIE MANUELLE -->

        <form id="manual-form" class="space-y-3">

            <label
                for="ticket-input"
                class="block text-sm font-semibold text-slate-300"
            >
                Entrer le numéro du billet
            </label>

            <input
                type="text"
                id="ticket-input"
                placeholder="Ex : TALA-A1B2C3"
                autocomplete="off"
                autocapitalize="characters"
                class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-cyan-400 uppercase font-mono"
            >

            <button
                type="submit"
                id="verify-button"
                class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl transition-all"
            >
                🔍 Vérifier
            </button>

        </form>


        <!-- RÉSULTAT -->

        <div
            id="status-card"
            class="mt-6 p-5 rounded-2xl bg-slate-800/50 border border-slate-700/50"
        >

            <div
                id="status-text"
                class="text-center text-slate-300"
            >
                Scannez le QR Code du billet.
            </div>

        </div>


        <!-- NOUVEAU BILLET -->

        <button
            id="new-ticket-button"
            type="button"
            class="hidden w-full mt-4 bg-slate-700 hover:bg-slate-600 text-white font-semibold py-3 rounded-xl"
        >
            🔄 Scanner un autre billet
        </button>


        <p class="text-center text-xs text-slate-600 mt-5">
            TALA Trajet • Contrôle des réservations
        </p>

    </div>

</main>

<script>

    /* =========================================================
       SUPABASE
    ========================================================= */

    const supabaseUrl =
        "https://kfkifkstatbadtzosxai.supabase.co";

    /*
     * IMPORTANT :
     * Mets ici ta vraie clé ANON publique.
     *
     * Ne mets JAMAIS la service_role key dans cette page.
     */

    const supabaseKey =
        "TA_CLE_ANON_SUPABASE";


    const supabaseClient =
        window.supabase.createClient(
            supabaseUrl,
            supabaseKey
        );


    /* =========================================================
       ÉLÉMENTS
    ========================================================= */

    const reader =
        document.getElementById("reader");

    const cameraButton =
        document.getElementById("camera-button");

    const scannerMessage =
        document.getElementById("scanner-message");

    const form =
        document.getElementById("manual-form");

    const input =
        document.getElementById("ticket-input");

    const verifyButton =
        document.getElementById("verify-button");

    const statusCard =
        document.getElementById("status-card");

    const statusText =
        document.getElementById("status-text");

    const newTicketButton =
        document.getElementById("new-ticket-button");


    /* =========================================================
       SCANNER
    ========================================================= */

    let html5QrCode = null;

    let scannerRunning = false;

    let scanLocked = false;


    /* =========================================================
       DÉMARRER LE SCANNER
    ========================================================= */

    async function startScanner() {

        if (scannerRunning) {
            return;
        }

        try {

            scanLocked = false;

            html5QrCode =
                new Html5Qrcode("reader");


            const cameras =
                await Html5Qrcode.getCameras();


            if (!cameras || cameras.length === 0) {

                scannerMessage.innerText =
                    "Aucune caméra détectée.";

                return;
            }


            /*
             * On privilégie la caméra arrière
             */

            let cameraId =
                cameras[0].id;


            const backCamera =
                cameras.find(camera =>
                    /back|rear|environment|arrière/i.test(
                        camera.label
                    )
                );


            if (backCamera) {

                cameraId =
                    backCamera.id;

            }


            await html5QrCode.start(

                cameraId,

                {
                    fps: 10,

                    qrbox: {
                        width: 250,
                        height: 250
                    },

                    aspectRatio: 1.0

                },

                onScanSuccess,

                onScanError

            );


            scannerRunning = true;


            cameraButton.innerText =
                "🛑 Arrêter le scanner";


            cameraButton.classList.remove(
                "bg-cyan-500"
            );

            cameraButton.classList.add(
                "bg-red-500"
            );


            scannerMessage.innerText =
                "Placez le QR Code dans le cadre.";


        } catch (error) {

            console.error(
                "Erreur caméra :",
                error
            );


            scannerMessage.innerText =
                "Impossible d'accéder à la caméra. Vérifiez l'autorisation du navigateur.";

        }

    }


    /* =========================================================
       ARRÊTER LE SCANNER
    ========================================================= */

    async function stopScanner() {

        if (!html5QrCode || !scannerRunning) {
            return;
        }


        try {

            await html5QrCode.stop();

            html5QrCode.clear();

        } catch (error) {

            console.error(
                "Erreur arrêt scanner :",
                error
            );

        }


        scannerRunning = false;


        cameraButton.innerText =
            "📷 Démarrer le scanner";


        cameraButton.classList.remove(
            "bg-red-500"
        );

        cameraButton.classList.add(
            "bg-cyan-500"
        );


        scannerMessage.innerText =
            "Scanner arrêté.";

    }


    /* =========================================================
       BOUTON CAMÉRA
    ========================================================= */

    cameraButton.addEventListener(
        "click",
        async function() {

            if (scannerRunning) {

                await stopScanner();

            } else {

                await startScanner();

            }

        }
    );


    /* =========================================================
       QR SCANNÉ
    ========================================================= */

    async function onScanSuccess(decodedText) {

        /*
         * Évite que le scanner lise le même QR
         * plusieurs fois en quelques millisecondes.
         */

        if (scanLocked) {
            return;
        }

        scanLocked = true;


        console.log(
            "QR détecté :",
            decodedText
        );


        /*
         * Arrêter la caméra après lecture
         */

        await stopScanner();


        /*
         * Le QR peut contenir :
         *
         * TALA-A1B2C3
         *
         * OU
         *
         * https://tala-trajet-ivory.vercel.app/controle.html?ticket=TALA-A1B2C3
         */

        const ticket =
            extractTicketFromQR(decodedText);


        if (!ticket) {

            afficherErreur(
                "QR Code invalide. Aucun numéro de billet trouvé."
            );

            scanLocked = false;

            return;
        }


        input.value =
            ticket;


        await verifierBillet(ticket);

    }


    /* =========================================================
       ERREUR DE SCAN
    ========================================================= */

    function onScanError(errorMessage) {

        /*
         * Ne rien afficher ici.
         *
         * Le scanner génère énormément de messages
         * pendant qu'il cherche un QR Code.
         */

    }


    /* =========================================================
       EXTRAIRE LE NUMÉRO DU QR
    ========================================================= */

    function extractTicketFromQR(value) {

        if (!value) {
            return null;
        }


        value =
            value.trim();


        /*
         * CAS 1 :
         * Le QR contient directement le numéro
         *
         * TALA-A1B2C3
         */

        if (
            value.toUpperCase().startsWith("TALA-")
        ) {

            return value
                .toUpperCase();

        }


        /*
         * CAS 2 :
         * Le QR contient une URL
         *
         * ...controle.html?ticket=TALA-A1B2C3
         */

        try {

            const url =
                new URL(value);


            const ticket =
                url.searchParams.get(
                    "ticket"
                );


            if (ticket) {

                return ticket
                    .trim()
                    .toUpperCase();

            }

        } catch (error) {

            /*
             * Ce n'est pas une URL.
             */

        }


        /*
         * CAS 3 :
         * Recherche d'un numéro TALA dans le texte
         */

        const match =
            value.match(
                /TALA-[A-Z0-9_-]+/i
            );


        if (match) {

            return match[0]
                .toUpperCase();

        }


        return null;

    }


    /* =========================================================
       FORMULAIRE MANUEL
    ========================================================= */

    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const ticket =
                input.value
                    .trim()
                    .toUpperCase();


            if (!ticket) {

                afficherErreur(
                    "Veuillez entrer un numéro de billet."
                );

                return;
            }


            await verifierBillet(ticket);

        }
    );


    /* =========================================================
       VÉRIFICATION SUPABASE
    ========================================================= */

    async function verifierBillet(ticketNumber) {

        setLoading(true);

        afficherChargement(ticketNumber);


        try {

            const {
                data,
                error
            } = await supabaseClient

                .from("reservations")

                .select(`
                    *,
                    trips (
                        ville_depart,
                        ville_arrivee,
                        date_depart,
                        heure_depart
                    )
                `)

                .eq(
                    "ticket_number",
                    ticketNumber
                )

                .maybeSingle();


            /* ERREUR */

            if (error) {

                console.error(
                    "Supabase :",
                    error
                );

                afficherErreur(
                    "Impossible de vérifier le billet."
                );

                return;
            }


            /* INTROUVABLE */

            if (!data) {

                afficherIntrouvable(
                    ticketNumber
                );

                return;
            }


            /* =================================================
               DONNÉES
            ================================================= */

            const statut =
                String(
                    data.statut || ""
                )
                .trim()
                .toUpperCase();


            const ticket =
                data.ticket_number ||
                ticketNumber;


            const nomClient =
                data.nom_client ||
                "Non spécifié";


            const telephone =
                data.telephone_client ||
                "Non spécifié";


            let seats =
                "Non spécifié";


            if (
                Array.isArray(data.seats)
            ) {

                seats =
                    data.seats.join(", ");

            } else if (data.seats) {

                seats =
                    data.seats;

            }


            const trip =
                data.trips || {};


            const villeDepart =
                trip.ville_depart ||
                "Départ";


            const villeArrivee =
                trip.ville_arrivee ||
                "Arrivée";


            const dateDepart =
                trip.date_depart ||
                "Non spécifiée";


            const heureDepart =
                trip.heure_depart ||
                "Non spécifiée";


            /* =================================================
               DÉJÀ UTILISÉ
            ================================================= */

            if (
                statut === "USED" ||
                statut === "UTILISE" ||
                statut === "UTILISÉ"
            ) {

                afficherDejaUtilise({

                    ticket,
                    nomClient,
                    villeDepart,
                    villeArrivee,
                    seats

                });

                return;
            }


            /* =================================================
               STATUTS ACCEPTÉS
            ================================================= */

            const statutsValides = [

                "CONFIRME",
                "CONFIRMÉ",
                "CONFIRMED",
                "PAID",
                "SUCCESS",
                "COMPLETED"

            ];


            if (
                !statutsValides.includes(statut)
            ) {

                afficherNonValide({

                    ticket,
                    nomClient,
                    telephone,
                    statut

                });

                return;
            }


            /* =================================================
               BILLET VALIDE
            ================================================= */

            afficherBilletValide({

                ticket,
                nomClient,
                telephone,
                villeDepart,
                villeArrivee,
                dateDepart,
                heureDepart,
                seats,
                reservationId: data.id

            });


        } catch (error) {

            console.error(
                error
            );

            afficherErreur(
                "Erreur pendant la vérification."
            );

        } finally {

            setLoading(false);

        }

    }


    /* =========================================================
       CONFIRMER EMBARQUEMENT
    ========================================================= */

    async function confirmerEmbarquement(
        ticketNumber,
        reservationId
    ) {

        setLoading(true);


        try {

            const {
                data,
                error
            } = await supabaseClient

                .from("reservations")

                .update({
                    statut: "USED"
                })

                .eq(
                    "id",
                    reservationId
                )

                .in(
                    "statut",
                    [
                        "CONFIRME",
                        "CONFIRMÉ",
                        "CONFIRMED",
                        "PAID",
                        "SUCCESS",
                        "COMPLETED"
                    ]
                )

                .select()

                .maybeSingle();


            if (error) {

                console.error(
                    error
                );

                afficherErreur(
                    "Impossible de confirmer l'embarquement."
                );

                return;
            }


            /*
             * Aucun résultat =
             * billet déjà utilisé ou statut modifié.
             */

            if (!data) {

                afficherDejaUtiliseSimple();

                return;
            }


            afficherEmbarquementConfirme();


        } catch (error) {

            console.error(
                error
            );

            afficherErreur(
                "Erreur lors de la confirmation."
            );

        } finally {

            setLoading(false);

        }

    }


    /* ========================================================
       AFFICHAGE CHARGEMENT
    ========================================================= */

    function afficherChargement(ticket) {

        statusCard.className =
            "mt-6 p-5 rounded-2xl bg-slate-800/50 border border-slate-700";

        statusText.innerHTML = `

            <div class="text-center">

                <div class="text-4xl mb-3 animate-pulse">
                    🔎
                </div>

                <p class="font-bold">
                    Vérification du billet
                </p>

                <p class="text-cyan-300 font-mono text-sm mt-2">
                    ${escapeHTML(ticket)}
                </p>

            </div>

        `;

        newTicketButton.classList.add(
            "hidden"
        );

    }


    /* =========================================================
       BILLET INTROUVABLE
    ========================================================= */

    function afficherIntrouvable(ticket) {

        statusCard.className =
            "mt-6 p-5 rounded-2xl bg-red-950/40 border border-red-800";

        statusText.innerHTML = `

            <div class="text-4xl mb-3">
                ❌
            </div>

            <h2 class="text-xl font-bold text-red-400">
                Billet introuvable
            </h2>

            <p class="text-sm text-slate-300 mt-2">
                Aucun billet ne correspond à :
            </p>

            <p class="font-mono text-cyan-300 mt-2">
                ${escapeHTML(ticket)}
            </p>

        `;

        newTicketButton.classList.remove(
            "hidden"
        );

    }


    /* =========================================================
       BILLET NON VALIDE
    ========================================================= */

    function afficherNonValide(info) {

        statusCard.className =
            "mt-6 p-5 rounded-2xl bg-red-950/40 border border-red-800";

        statusText.innerHTML = `

            <div class="text-4xl mb-3">
                🚫
            </div>

            <h2 class="text-xl font-bold text-red-400">
                Billet non valide
            </h2>

            <p class="text-sm text-slate-300 mt-2">
                Cette réservation n'est pas confirmée.
            </p>

            <div class="text-left mt-4 bg-slate-950/70 p-4 rounded-xl space-y-2">

                <p>
                    <strong>Billet :</strong>
                    <span class="font-mono text-cyan-300">
                        ${escapeHTML(info.ticket)}
                    </span>
                </p>

                <p>
                    <strong>Client :</strong>
                    ${escapeHTML(info.nomClient)}
                </p>

                <p>
                    <strong>Statut :</strong>
                    <span class="text-red-400 font-bold">
                        ${escapeHTML(info.statut || "INCONNU")}
                    </span>
                </p>

            </div>

        `;

        newTicketButton.classList.remove(
            "hidden"
        );

    }


    /* =========================================================
       DÉJÀ UTILISÉ
    ========================================================= */

    function afficherDejaUtilise(info) {

        statusCard.className =
            "mt-6 p-5 rounded-2xl bg-amber-950/40 border border-amber-800";

        statusText.innerHTML = `

            <div class="text-4xl mb-3">
                ⚠️
            </div>

            <h2 class="text-xl font-bold text-amber-400">
                Billet déjà utilisé
            </h2>

            <p class="text-sm text-amber-200 mt-2">
                Ce billet a déjà été validé.
            </p>

            <div class="text-left mt-4 bg-slate-950/70 p-4 rounded-xl space-y-2">

                <p>
                    <strong>Billet :</strong>
                    <span class="font-mono text-cyan-300">
                        ${escapeHTML(info.ticket)}
                    </span>
                </p>

                <p>
                    <strong>Passager :</strong>
                    ${escapeHTML(info.nomClient)}
                </p>

                <p>
                    <strong>Trajet :</strong>
                    ${escapeHTML(info.villeDepart)}
                    →
                    ${escapeHTML(info.villeArrivee)}
                </p>

                <p>
                    <strong>Siège(s) :</strong>
                    ${escapeHTML(info.seats)}
                </p>

            </div>

        `;

        newTicketButton.classList.remove(
            "hidden"
        );

    }


    /* =========================================================
       BILLET VALIDE
    ========================================================= */

    function afficherBilletValide(info) {

        statusCard.className =
            "mt-6 p-5 rounded-2xl bg-emerald-950/40 border border-emerald-800";

        statusText.innerHTML = `

            <div class="text-4xl mb-2">
                🎫
            </div>

            <h2 class="text-2xl font-bold text-emerald-400">
                BILLET VALIDE
            </h2>

            <p class="text-sm text-emerald-200 mt-1">
                Réservation confirmée
            </p>


            <div class="text-left mt-5 bg-slate-950/80 p-4 rounded-xl border border-emerald-900 space-y-2">

                <p>
                    <strong>N° Billet :</strong>
                    <span class="font-mono text-cyan-300">
                        ${escapeHTML(info.ticket)}
                    </span>
                </p>

                <p>
                    <strong>Passager :</strong>
                    ${escapeHTML(info.nomClient)}
                </p>

                <p>
                    <strong>Téléphone :</strong>
                    ${escapeHTML(info.telephone)}
                </p>

                <p>
                    <strong>Trajet :</strong>
                    ${escapeHTML(info.villeDepart)}
                    →
                    ${escapeHTML(info.villeArrivee)}
                </p>

                <p>
                    <strong>Date :</strong>
                    ${escapeHTML(info.dateDepart)}
                </p>

                <p>
                    <strong>Heure :</strong>
                    ${escapeHTML(info.heureDepart)}
                </p>

                <p>
                    <strong>Siège(s) :</strong>
                    ${escapeHTML(info.seats)}
                </p>

            </div>


            <button
                id="confirm-boarding"
                type="button"
                class="w-full mt-5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl transition-all"
            >
                ✅ Confirmer l'embarquement
            </button>

        `;


        document
            .getElementById("confirm-boarding")
            .addEventListener(
                "click",
                function() {

                    confirmerEmbarquement(
                        info.ticket,
                        info.reservationId
                    );

                }
            );

    }


    /* =========================================================
       EMBARQUEMENT CONFIRMÉ
    ========================================================= */

    function afficherEmbarquementConfirme() {

        statusCard.className =
            "mt-6 p-5 rounded-2xl bg-emerald-950/40 border border-emerald-700";

        statusText.innerHTML = `

            <div class="text-5xl mb-3">
                ✅
            </div>

            <h2 class="text-2xl font-bold text-emerald-400">
                EMBARQUEMENT CONFIRMÉ
            </h2>

            <p class="text-slate-300 text-sm mt-2">
                Le billet est validé.
            </p>

            <p class="text-xs text-emerald-300 mt-3">
                Ce billet ne pourra plus être utilisé une seconde fois.
            </p>

        `;

        newTicketButton.classList.remove(
            "hidden"
        );

    }


    /* =========================================================
       DÉJÀ UTILISÉ
    ========================================================= */

    function afficherDejaUtiliseSimple() {

        statusCard.className =
            "mt-6 p-5 rounded-2xl bg-amber-950/40 border border-amber-800";

        statusText.innerHTML = `

            <div class="text-4xl mb-3">
                ⚠️
            </div>

            <h2 class="text-xl font-bold text-amber-400">
                Billet déjà utilisé
            </h2>

            <p class="text-sm text-slate-300 mt-2">
                Ce billet vient d'être validé par un autre contrôleur.
            </p>

        `;

        newTicketButton.classList.remove(
            "hidden"
        );

    }


    /* =========================================================
       ERREUR
    ========================================================= */

    function afficherErreur(message) {

        statusCard.className =
            "mt-6 p-5 rounded-2xl bg-red-950/40 border border-red-800";

        statusText.innerHTML = `

            <div class="text-4xl mb-3">
                ❌
            </div>

            <h2 class="text-xl font-bold text-red-400">
                Erreur
            </h2>

            <p class="text-sm text-slate-300 mt-2">
                ${escapeHTML(message)}
            </p>

        `;

        newTicketButton.classList.remove(
            "hidden"
        );

    }


    /* =========================================================
       LOADING
    ========================================================= */

    function setLoading(isLoading) {

        verifyButton.disabled =
            isLoading;


        verifyButton.classList.toggle(
            "opacity-50",
            isLoading
        );


        if (isLoading) {

            verifyButton.innerText =
                "⏳ Vérification...";

        } else {

            verifyButton.innerText =
                "🔍 Vérifier";

        }

    }


    /* =========================================================
       NOUVEAU BILLET
    ========================================================= */

    newTicketButton.addEventListener(
        "click",
        async function() {

            input.value = "";

            scanLocked = false;

            statusCard.className =
                "mt-6 p-5 rounded-2xl bg-slate-800/50 border border-slate-700/50";

            statusText.innerHTML = `
                <p class="text-slate-300">
                    Scannez le prochain QR Code.
                </p>
            `;

            newTicketButton.classList.add(
                "hidden"
            );


            /*
             * Redémarrer automatiquement la caméra
             */

            await startScanner();

        }
    );


    /* =========================================================
       QR DANS L'URL
       
       Exemple :
       controle.html?ticket=TALA-A1B2C3
    ========================================================= */

    document.addEventListener(
        "DOMContentLoaded",
        function() {

            const params =
                new URLSearchParams(
                    window.location.search
                );


            const ticket =
                params.get("ticket");


            if (ticket) {

                const cleanTicket =
                    ticket
                        .trim()
                        .toUpperCase();


                input.value =
                    cleanTicket;


                verifierBillet(
                    cleanTicket
                );

            }

        }
    );

</script>
