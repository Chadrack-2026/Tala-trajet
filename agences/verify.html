<!DOCTYPE html><html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TALA Trajet - Contrôle du Billet</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
    body {
        font-family: Arial, sans-serif;
    }

    .hidden {
        display: none !important;
    }
</style>

</head><body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4"><main class="w-full max-w-md">

    <!-- CARTE PRINCIPALE -->
    <div class="bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl p-6">

        <!-- EN-TÊTE -->
        <div class="text-center mb-6">
            <div class="text-4xl mb-2">🎫</div>

            <h1 class="text-2xl font-bold text-cyan-400">
                TALA Contrôle
            </h1>

            <p class="text-slate-400 text-sm mt-1">
                Vérification du billet
            </p>
        </div>


        <!-- FORMULAIRE -->
        <form id="manual-form" class="space-y-3">

            <label
                for="ticket-input"
                class="block text-sm font-semibold text-slate-300"
            >
                Numéro du billet
            </label>

            <input
                type="text"
                id="ticket-input"
                placeholder="Ex : TALA-A1B2C3"
                autocomplete="off"
                autocapitalize="characters"
                class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-cyan-400 uppercase font-mono"
                required
            >

            <button
                type="submit"
                id="verify-button"
                class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 rounded-xl transition-all"
            >
                🔍 Vérifier le billet
            </button>

        </form>


        <!-- RÉSULTAT -->
        <div
            id="status-card"
            class="mt-6 p-5 rounded-2xl bg-slate-800/50 border border-slate-700/50"
        >

            <div
                id="status-text"
                class="text-center text-slate-300"
            >
                Entrez le numéro du billet pour commencer.
            </div>

        </div>


        <!-- BOUTON NOUVEAU BILLET -->
        <button
            id="new-ticket-button"
            type="button"
            class="hidden w-full mt-4 bg-slate-700 hover:bg-slate-600 text-white font-semibold py-3 rounded-xl transition-all"
        >
            🔄 Vérifier un autre billet
        </button>


        <!-- INFORMATION -->
        <p class="text-center text-xs text-slate-500 mt-5">
            Vérifiez le billet avant de confirmer l'embarquement.
        </p>

    </div>

</main>

<script>

    /* =========================================================
       CONFIGURATION SUPABASE
    ========================================================= */

    const supabaseUrl =
        "https://kfkifkstatbadtzosxai.supabase.co";

    const supabaseKey =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtma2lma3N0YT...";

    const supabaseClient =
        window.supabase.createClient(
            supabaseUrl,
            supabaseKey
        );


    /* =========================================================
       ÉLÉMENTS
    ========================================================= */

    const form =
        document.getElementById("manual-form");

    const input =
        document.getElementById("ticket-input");

    const verifyButton =
        document.getElementById("verify-button");

    const statusCard =
        document.getElementById("status-card");

    const statusText =
        document.getElementById("status-text");

    const newTicketButton =
        document.getElementById("new-ticket-button");


    /* =========================================================
       ÉCHAPPEMENT HTML
       Évite d'injecter du HTML provenant de la base
    ========================================================= */

    function escapeHTML(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /* =========================================================
       FORMULAIRE
    ========================================================= */

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const ticketNumber =
            input.value.trim().toUpperCase();

        if (!ticketNumber) {
            afficherErreur(
                "Veuillez entrer un numéro de billet."
            );
            return;
        }

        await verifierBillet(ticketNumber);

    });


    /* =========================================================
       VÉRIFICATION DU BILLET
    ========================================================= */

    async function verifierBillet(ticketNumber) {

        setLoading(true);

        afficherChargement(ticketNumber);


        try {

            /*
             * Recherche de la réservation
             */
            const { data, error } = await supabaseClient

                .from("reservations")

                .select(`
                    *,
                    trips (
                        ville_depart,
                        ville_arrivee,
                        date_depart,
                        heure_depart
                    )
                `)

                .eq(
                    "ticket_number",
                    ticketNumber
                )

                .maybeSingle();


            /* =================================================
               ERREUR SUPABASE
            ================================================= */

            if (error) {

                console.error(
                    "Erreur Supabase :",
                    error
                );

                afficherErreur(
                    "Impossible de vérifier ce billet."
                );

                setLoading(false);

                return;
            }


            /* =================================================
               BILLET INTROUVABLE
            ================================================= */

            if (!data) {

                afficherIntrouvable(
                    ticketNumber
                );

                setLoading(false);

                return;
            }


            /* =================================================
               RÉCUPÉRATION DES INFORMATIONS
            ================================================= */

            const statut =
                String(data.statut || "")
                    .trim()
                    .toUpperCase();


            const nomClient =
                data.nom_client ||
                "Non spécifié";


            const telephone =
                data.telephone_client ||
                "Non spécifié";


            const ticket =
                data.ticket_number ||
                ticketNumber;


            let seats = "Non spécifié";


            if (Array.isArray(data.seats)) {

                seats =
                    data.seats.join(", ");

            } else if (data.seats) {

                seats =
                    data.seats;

            }


            const trip =
                data.trips || {};


            const villeDepart =
                trip.ville_depart ||
                "Départ";


            const villeArrivee =
                trip.ville_arrivee ||
                "Arrivée";


            const dateDepart =
                trip.date_depart ||
                "Non spécifiée";


            const heureDepart =
                trip.heure_depart ||
                "Non spécifiée";


            /* =================================================
               BILLET DÉJÀ UTILISÉ
            ================================================= */

            if (
                statut === "USED" ||
                statut === "UTILISE" ||
                statut === "UTILISÉ"
            ) {

                afficherDejaUtilise({
                    ticket,
                    nomClient,
                    villeDepart,
                    villeArrivee,
                    seats
                });

                setLoading(false);

                return;
            }


            /* =================================================
               VÉRIFICATION DU PAIEMENT / CONFIRMATION
            ================================================= */

            const statutsValides = [

                "CONFIRME",
                "CONFIRMÉ",
                "PAID",
                "SUCCESS",
                "COMPLETED",
                "CONFIRMED"

            ];


            if (!statutsValides.includes(statut)) {

                afficherNonValide({
                    ticket,
                    nomClient,
                    telephone,
                    statut
                });

                setLoading(false);

                return;
            }


            /* =================================================
               BILLET VALIDE
            ================================================= */

            afficherBilletValide({
                ticket,
                nomClient,
                telephone,
                villeDepart,
                villeArrivee,
                dateDepart,
                heureDepart,
                seats,
                reservationId: data.id
            });


        } catch (error) {

            console.error(
                "Erreur :",
                error
            );

            afficherErreur(
                "Une erreur est survenue pendant la vérification."
            );

        } finally {

            setLoading(false);

        }

    }


    /* =========================================================
       CONFIRMER L'EMBARQUEMENT
    ========================================================= */

    async function confirmerEmbarquement(
        ticketNumber,
        reservationId
    ) {

        setLoading(true);


        try {

            /*
             * IMPORTANT :
             * On vérifie une nouvelle fois que le billet
             * est toujours CONFIRME avant de le passer à USED.
             *
             * Cela réduit le risque de double validation.
             */

            const { data, error } = await supabaseClient

                .from("reservations")

                .update({
                    statut: "USED"
                })

                .eq("id", reservationId)

                .in("statut", [
                    "CONFIRME",
                    "CONFIRMÉ",
                    "PAID",
                    "SUCCESS",
                    "COMPLETED",
                    "CONFIRMED"
                ])

                .select()

                .maybeSingle();


            if (error) {

                console.error(
                    "Erreur validation :",
                    error
                );

                afficherErreur(
                    "Impossible de confirmer l'embarquement."
                );

                setLoading(false);

                return;
            }


            /*
             * Aucun enregistrement modifié
             * signifie généralement que le billet
             * a déjà été utilisé entre-temps.
             */

            if (!data) {

                afficherDejaUtiliseSimple();

                setLoading(false);

                return;
            }


            /* =================================================
               EMBARQUEMENT CONFIRMÉ
            ================================================= */

            afficherEmbarquementConfirme();

        } catch (error) {

            console.error(
                error
            );

            afficherErreur(
                "Erreur lors de la confirmation."
            );

        } finally {

            setLoading(false);

        }

    }


    /* =========================================================
       AFFICHAGE CHARGEMENT
    ========================================================= */

    function afficherChargement(ticket) {

        statusCard.className =
            "mt-6 p-5 rounded-2xl bg-slate-800/50 border border-slate-700";

        statusText.innerHTML = `

            <div class="flex flex-col items-center">

                <div class="text-3xl animate-pulse mb-3">
                    🔎
                </div>

                <p class="font-semibold text-white">
                    Vérification...
                </p>

                <p class="text-sm text-slate-400 mt-1 font-mono">
                    ${escapeHTML(ticket)}
                </p>

            </div>
        `;

        newTicketButton.classList.add("hidden");

    }


    /* =========================================================
       BILLET INTROUVABLE
    ========================================================= */

    function afficherIntrouvable(ticket) {

        statusCard.className =
            "mt-6 p-5 rounded-2xl bg-red-950/40 border border-red-800";

        statusText.innerHTML = `

            <div class="text-4xl mb-3">
                ❌
            </div>

            <h2 class="text-xl font-bold text-red-400">
                Billet introuvable
            </h2>

            <p class="text-sm text-slate-300 mt-2">
                Aucun billet ne correspond au numéro :
            </p>

            <p class="font-mono text-cyan-300 mt-2">
                ${escapeHTML(ticket)}
            </p>

        `;

        newTicketButton.classList.remove("hidden");

    }


    /* =========================================================
       BILLET NON VALIDE
    ========================================================= */

    function afficherNonValide(info) {

        statusCard.className =
            "mt-6 p-5 rounded-2xl bg-red-950/40 border border-red-800";

        statusText.innerHTML = `

            <div class="text-4xl mb-3">
                🚫
            </div>

            <h2 class="text-xl font-bold text-red-400">
                Billet non valide
            </h2>

            <div class="text-left mt-4 bg-slate-950/70 p-4 rounded-xl space-y-2">

                <p>
                    <strong>Billet :</strong>
                    <span class="font-mono text-cyan-300">
                        ${escapeHTML(info.ticket)}
                    </span>
                </p>

                <p>
                    <strong>Client :</strong>
                    ${escapeHTML(info.nomClient)}
                </p>

                <p>
                    <strong>Téléphone :</strong>
                    ${escapeHTML(info.telephone)}
                </p>

                <p>
                    <strong>Statut :</strong>
                    <span class="text-red-400 font-bold">
                        ${escapeHTML(info.statut || "INCONNU")}
                    </span>
                </p>

            </div>

            <p class="text-xs text-red-300 mt-4">
                Ce billet n'est pas confirmé pour l'embarquement.
            </p>

        `;

        newTicketButton.classList.remove("hidden");

    }


    /* =========================================================
       BILLET DÉJÀ UTILISÉ
    ========================================================= */

    function afficherDejaUtilise(info) {

        statusCard.className =
            "mt-6 p-5 rounded-2xl bg-amber-950/40 border border-amber-800";

        statusText.innerHTML = `

            <div class="text-4xl mb-3">
                ⚠️
            </div>

            <h2 class="text-xl font-bold text-amber-400">
                Billet déjà utilisé
            </h2>

            <p class="text-sm text-amber-200 mt-2">
                Ce billet a déjà été validé pour l'embarquement.
            </p>

            <div class="text-left mt-4 bg-slate-950/70 p-4 rounded-xl space-y-2">

                <p>
                    <strong>Billet :</strong>
                    <span class="font-mono text-cyan-300">
                        ${escapeHTML(info.ticket)}
                    </span>
                </p>

                <p>
                    <strong>Passager :</strong>
                    ${escapeHTML(info.nomClient)}
                </p>

                <p>
                    <strong>Trajet :</strong>
                    ${escapeHTML(info.villeDepart)}
                    →
                    ${escapeHTML(info.villeArrivee)}
                </p>

                <p>
                    <strong>Siège(s) :</strong>
                    ${escapeHTML(info.seats)}
                </p>

            </div>

        `;

        newTicketButton.classList.remove("hidden");

    }


    /* =========================================================
       BILLET VALIDE
    ========================================================= */

    function afficherBilletValide(info) {

        statusCard.className =
            "mt-6 p-5 rounded-2xl bg-emerald-950/40 border border-emerald-800";

        statusText.innerHTML = `

            <div class="text-4xl mb-2">
                🎫
            </div>

            <h2 class="text-2xl font-bold text-emerald-400">
                BILLET VALIDE
            </h2>

            <p class="text-sm text-emerald-200 mt-1">
                Réservation confirmée
            </p>


            <div class="text-left mt-5 bg-slate-950/80 p-4 rounded-xl border border-emerald-900 space-y-2">

                <p>
                    <strong>N° Billet :</strong>
                    <span class="font-mono text-cyan-300">
                        ${escapeHTML(info.ticket)}
                    </span>
                </p>

                <p>
                    <strong>Passager :</strong>
                    ${escapeHTML(info.nomClient)}
                </p>

                <p>
                    <strong>Téléphone :</strong>
                    ${escapeHTML(info.telephone)}
                </p>

                <p>
                    <strong>Trajet :</strong>
                    ${escapeHTML(info.villeDepart)}
                    →
                    ${escapeHTML(info.villeArrivee)}
                </p>

                <p>
                    <strong>Date :</strong>
                    ${escapeHTML(info.dateDepart)}
                </p>

                <p>
                    <strong>Heure :</strong>
                    ${escapeHTML(info.heureDepart)}
                </p>

                <p>
                    <strong>Siège(s) :</strong>
                    ${escapeHTML(info.seats)}
                </p>

            </div>


            <!-- CONFIRMATION EMBARQUEMENT -->

            <button
                id="confirm-boarding"
                type="button"
                class="w-full mt-5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl transition-all"
            >
                ✅ Confirmer l'embarquement
            </button>

        `;


        document
            .getElementById("confirm-boarding")
            .addEventListener(
                "click",
                function() {

                    confirmerEmbarquement(
                        info.ticket,
                        info.reservationId
                    );

                }
            );

    }


    /* ==ticket=TALA-A1B2C3
    ========================================================= */

    document.addEventListener(
        "DOMContentLoaded",
        function() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            const ticket =
                params.get("ticket");

            if (ticket) {

                const cleanTicket =
                    ticket
                        .trim()
                        .toUpperCase();

                input.value =
                    cleanTicket;

                verifierBillet(
                    cleanTicket
                );

            }

        }
    );

</script>

</body>
</html>
