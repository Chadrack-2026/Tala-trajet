<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TALA Trajet - Contrôle Multiple des Billets</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-start p-4 md:p-8">

    <div class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 text-center">
        <h1 class="text-2xl font-bold text-cyan-400 mb-1">TALA Contrôle 🎫</h1>
        <p class="text-slate-400 text-sm mb-6">Validation groupée de l'embarquement</p>

        <!-- Conteneur dynamique des résultats multiples -->
        <div id="results-container" class="space-y-4 text-left max-h-[60vh] overflow-y-auto pr-1">
            <div class="p-6 rounded-2xl bg-slate-800/50 border border-slate-700/50 text-center animate-pulse">
                <div class="h-6 w-3/4 bg-slate-700 rounded mx-auto mb-3"></div>
                <p class="text-slate-300 font-medium text-sm">Vérification des billets en cours...</p>
            </div>
        </div>

        <div class="mt-6 pt-4 border-t border-slate-800 text-center">
            <p class="text-xs text-slate-500">Fermez cet onglet ou retournez à l'application de scan pour le groupe suivant.</p>
        </div>
    </div>

<script>
// Clés Supabase de TALA Trajet
const supabaseUrl = "https://kfkifkstatbadtzosxai.supabase.co"; 
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtma2lma3N0YXRiYWR0em9zeGFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3MTYzMTAsImV4cCI6MjEwMTI5MjMxMH0.xPzFtl_OET2asSc5iH3liRHnPyuUYAfbbjZISwfnaA8";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

document.addEventListener("DOMContentLoaded", async () => {
    const container = document.getElementById("results-container");

    // Récupérer les paramètres URL (gère ?ticket=A,B,C ou plusieurs ?ticket=A&ticket=B ou ?tickets=A,B)
    const urlParams = new URLSearchParams(window.location.search);
    let rawTickets = urlParams.get('ticket') || urlParams.get('tickets') || '';
    
    // Si l'URL contient plusieurs paramètres "ticket" séparés
    let ticketList = [];
    if (urlParams.getAll('ticket').length > 1) {
        ticketList = urlParams.getAll('ticket');
    } else if (rawTickets) {
        // Séparer par des virgules si l'application envoie une liste séparée par des virgules
        ticketList = rawTickets.split(',').map(t => t.trim()).filter(Boolean);
    }

    if (ticketList.length === 0) {
        container.innerHTML = `
            <div class="p-6 rounded-2xl bg-red-950/40 border border-red-800/50 text-center">
                <span class="text-red-400 font-bold text-lg">❌ Aucun Billet Détecté</span>
                <p class="text-slate-300 text-sm mt-1">Aucun identifiant de billet n'a été fourni dans le lien.</p>
            </div>
        `;
        return;
    }

    try {
        // 1. Récupérer tous les billets correspondants dans Supabase en une seule requête (.in)
        const { data: reservations, error } = await supabase
            .from('reservations')
            .select('*')
            .in('ticket_number', ticketList);

        if (error) {
            throw error;
        }

        container.innerHTML = ""; // Vider le loader

        // Créer une map pour retrouver facilement les données par numéro de billet
        const foundMap = new Map();
        if (reservations) {
            reservations.forEach(res => foundMap.set(res.ticket_number, res));
        }

        // 2. Traiter chaque billet demandé
        for (const ticketNum of ticketList) {
            const data = foundMap.get(ticketNum);
            let cardHtml = "";

            if (!data) {
                // Billet introuvable
                cardHtml = `
                    <div class="p-4 rounded-xl bg-red-950/40 border border-red-800/50">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-red-400 font-bold text-sm">❌ Introuvable</span>
                            <span class="text-xs font-mono text-slate-400">${ticketNum}</span>
                        </div>
                        <p class="text-slate-300 text-xs">Ce numéro de billet n'existe pas dans le système.</p>
                    </div>
                `;
            } else if (data.statut === 'USED' || data.statut === 'utilisé') {
                // Billet déjà utilisé
                cardHtml = `
                    <div class="p-4 rounded-xl bg-amber-950/40 border border-amber-800/50">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-amber-400 font-bold text-sm">⚠️ Déjà Utilisé</span>
                            <span class="text-xs font-mono text-slate-400">${data.ticket_number}</span>
                        </div>
                        <div class="text-xs text-slate-300 space-y-0.5 mt-2">
                            <p><strong>Client :</strong> ${data.nom_client || 'Non spécifié'}</p>
                            <p><strong>Siège(s) :</strong> ${data.seats}</p>
                        </div>
                    </div>
                `;
            } else {
                // Valider le billet en base de données
                const { error: updateError } = await supabase
                    .from('reservations')
                    .update({ statut: 'USED' })
                    .eq('ticket_number', ticketNum);

                if (updateError) {
                    console.error("Erreur mise à jour statut:", updateError);
                }

                // Succès / Accès autorisé
                cardHtml = `
                    <div class="p-4 rounded-xl bg-emerald-950/40 border border-emerald-800/50">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-emerald-400 font-bold text-sm">✅ ACCÈS AUTORISÉ</span>
                            <span class="text-xs font-mono text-slate-400">${data.ticket_number}</span>
                        </div>
                        <div class="text-xs text-slate-200 space-y-1 mt-2">
                            <p><strong>Client :</strong> ${data.nom_client || 'Non spécifié'}</p>
                            <p><strong>Siège(s) :</strong> ${data.seats}</p>
                            <p><strong>Téléphone :</strong> ${data.telephone_client || 'N/A'}</p>
                        </div>
                    </div>
                `;
            }

            container.innerHTML += cardHtml;
        }

    } catch (err) {
        console.error("Erreur de validation groupée :", err);
        container.innerHTML = `
            <div class="p-6 rounded-2xl bg-red-950/40 border border-red-800/50 text-center">
                <span class="text-red-400 font-bold text-lg">❌ Erreur Serveur</span>
                <p class="text-slate-300 text-sm mt-1">Impossible de vérifier les billets pour le moment.</p>
            </div>
        `;
    }
});
</script>
</body>
</html>
