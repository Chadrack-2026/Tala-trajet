<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié — TALA Trajet Pro</title>

  <!-- Police -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary-blue: #00d2ff;
      --bg-dark: #0c0f13;
      --card-dark: #171b22;
      --border-color: #2a313b;
      --text-light: #e7edf3;
      --text-muted: #b0bcc9;
      --green: #2ecc71;
      --red: #e74c3c;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      box-sizing: border-box;
    }

    .brand-logo {
      text-align: center;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary-blue);
      margin-bottom: 25px;
    }
    .brand-logo span {
      color: #ffffff;
    }

    .card {
      background: var(--card-dark);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 30px 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 1.3rem;
      color: #ffffff;
      text-align: center;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 16px;
      background: #0c0f13;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: #ffffff;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary-blue);
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--primary-blue);
      color: #0c0f13;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-submit:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .btn-submit:disabled {
      background: #2a313b;
      color: #6c757d;
      cursor: not-allowed;
      transform: none;
    }

    .message-box {
      padding: 12px 15px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: none;
      text-align: center;
    }

    .message-box.success {
      background: rgba(46, 204, 113, 0.15);
      color: var(--green);
      border: 1px solid var(--green);
    }

    .message-box.error {
      background: rgba(231, 76, 60, 0.15);
      color: var(--red);
      border: 1px solid var(--red);
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--primary-blue);
    }
  </style>
</head>
<body>

<div class="login-container">
  
  <div class="brand-logo">
    TALA<span>Trajet</span> <small style="font-size:0.5em; color:var(--primary-blue);">| Pro</small>
  </div>

  <div class="card">
    <h2>Mot de passe oublié ? 🔑</h2>
    <p>Entrez l'adresse e-mail associée à votre compte agence. Nous vous enverrons un lien de réinitialisation.</p>

    <!-- Message d'état -->
    <div id="alertBox" class="message-box"></div>

    <form id="resetForm" onsubmit="handleResetPassword(event)">
      <div class="form-group">
        <label for="email">Adresse e-mail professionnelle</label>
        <input type="email" id="email" placeholder="contact@compagnie.com" required>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">Envoyer le lien 📩</button>
    </form>

    <a href="agency-login.html" class="back-link">Retour à la connexion</a>
  </div>

</div>

<script>
  const { createClient } = window.supabase;
  const supabaseUrl = "https://iyiuysgwbreaqkepilqn.supabase.co";
  const supabaseKey = "sb_publishable_uPwAsJaGU4m_ejyajmEv2A_dLgqIM3h";
  const supabaseClient = createClient(supabaseUrl, supabaseKey);

  async function handleResetPassword(event) {
    event.preventDefault();
    
    const email = document.getElementById("email").value.trim();
    const submitBtn = document.getElementById("submitBtn");
    const alertBox = document.getElementById("alertBox");

    submitBtn.disabled = true;
    submitBtn.textContent = "Envoi en cours...";
    alertBox.style.display = "none";

    try {
      // Envoi du lien de réinitialisation via Supabase Auth
      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/agences/agency-login.html?type=recovery'
      });

      if (error) {
        showAlert(false, "Erreur : " + error.message);
      } else {
        showAlert(true, "Un e-mail de réinitialisation vous a été envoyé ! Vérifiez votre boîte de réception.");
        document.getElementById("resetForm").reset();
      }
    } catch (err) {
      showAlert(false, "Une erreur réseau est survenue. Veuillez réessayer.");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Envoyer le lien 📩";
    }
  }

  function showAlert(isSuccess, message) {
    const alertBox = document.getElementById("alertBox");
    alertBox.className = "message-box " + (isSuccess ? "success" : "error");
    alertBox.textContent = message;
    alertBox.style.display = "block";
  }
</script>

</body>
</html>
