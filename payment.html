<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TALA Trajet — Paiement</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --primary-blue:#00d2ff;
  --accent-green:#2ecc71;
  --bg-dark:#0c0f13;
  --card-dark:#171b22;
  --text-light:#e7edf3;
  --input-bg:#1c2129;
  --input-border:#2a313b;
}

body {
  font-family:'Poppins',sans-serif;
  background:var(--bg-dark);
  color:var(--text-light);
  margin:0;
}

header.site-header {
  background:var(--card-dark);
  padding:16px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--input-border);
}

.brand {
  font-weight:700;
  font-size:1.4rem;
  color:var(--primary-blue);
}

.brand span {
  color:white;
}

.container {
  max-width:600px;
  margin:30px auto;
  padding:0 24px;
}

.card {
  background:var(--card-dark);
  border:1px solid var(--input-border);
  border-radius:16px;
  padding:24px;
  box-shadow:0 4px 12px rgba(0,0,0,.5);
}

.summary-box {
  background:#0c0f13;
  border:1px solid var(--input-border);
  border-radius:12px;
  padding:16px;
  margin:20px 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.price {
  color:var(--primary-blue);
  font-size:1.3rem;
  font-weight:700;
}

.form input {
  width:100%;
  box-sizing:border-box;
  padding:14px 16px;
  margin-bottom:18px;
  border-radius:12px;
  border:1px solid var(--input-border);
  background:var(--input-bg);
  color:white;
  font-size:15px;
}

.form input:focus {
  outline:none;
  border-color:var(--primary-blue);
}

label {
  display:block;
  color:#b0bcc9;
  font-size:.85rem;
  margin-bottom:8px;
}

button {
  width:100%;
  padding:15px;
  background:var(--primary-blue);
  color:#0c0f13;
  border:none;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  font-size:1rem;
  transition:.3s;
}

button:hover {
  opacity:.9;
}

button:disabled {
  background:#444;
  color:#888;
  cursor:not-allowed;
}
</style>

</head>

<body>

<header class="site-header">

<div class="brand">
TALA<span>Trajet</span>
</div>

<a href="booking.html"
style="color:#b0bcc9;text-decoration:none;">
← Modifier les sièges
</a>

</header>


<main class="container">

<section class="card">

<h2>
💳 Paiement Mobile Money
</h2>

<p style="color:#b0bcc9;font-size:.9rem;">
Sélectionnez votre opérateur et entrez votre numéro pour régler votre voyage.
</p>


<div class="summary-box">

<div>

<span style="font-size:.8rem;color:#b0bcc9;">
Trajet
</span>

<strong id="summaryRoute">
Chargement...
</strong>

</div>


<div style="text-align:right">

<span style="font-size:.8rem;color:#b0bcc9;">
Montant total
</span>

<div id="summaryPrice" class="price">
0 FC
</div>

</div>

</div>


<form id="paymentForm" class="form">


<label for="paymentPhone">
Numéro Mobile Money
(ex: 243XXXXXXXXX ou 08XXXXXXXX)
</label>


<input
type="tel"
id="paymentPhone"
placeholder="243XXXXXXXXX"
inputmode="numeric"
autocomplete="tel"
required>


<button type="submit" id="payBtn">
Confirmer et payer 🔒
</button>


</form>


</section>

</main>

<script>

// ===============================
// CONFIGURATION SUPABASE
// ===============================

const { createClient } = window.supabase;

const supabaseUrl = "https://kfkifkstatbadtzosxai.supabase.co";

const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJyZWYiLCJyb2xlIjoiYW5vbiJ9";

const supabaseClient = createClient(
    supabaseUrl,
    supabaseKey
);


let pendingReservation = null;


// ===============================
// CHARGEMENT RESERVATION
// ===============================

document.addEventListener("DOMContentLoaded",()=>{


const storedData = localStorage.getItem("reservationInfo");


if(!storedData){

alert("Aucune réservation en cours.");

window.location.href="search.html";

return;

}


pendingReservation = JSON.parse(storedData);



document.getElementById("summaryRoute").textContent =
`${pendingReservation.ville_depart} ➔ ${pendingReservation.ville_arrivee}`;



const price =
Number(pendingReservation.total_price) || 0;



document.getElementById("summaryPrice").textContent =
price.toLocaleString("fr-FR")+" FC";



if(pendingReservation.telephone_client){

document.getElementById("paymentPhone").value =
pendingReservation.telephone_client;

}


});



// ===============================
// FORMULAIRE PAIEMENT
// ===============================


document
.getElementById("paymentForm")
.addEventListener("submit", async(e)=>{


e.preventDefault();



const btn=document.getElementById("payBtn");



// Empêcher un deuxième paiement

if(localStorage.getItem("payment_pending")==="true"){

alert("Une transaction est déjà en cours.");

return;

}



let phone =
document.getElementById("paymentPhone")
.value.trim();



if(!phone){

alert("Veuillez entrer votre numéro.");

return;

}



// Format numéro RDC

if(phone.startsWith("243")){

phone="+"+phone;

}

else if(phone.startsWith("0")){

phone="+243"+phone.substring(1);

}

else if(!phone.startsWith("+")){

phone="+243"+phone;

}




const finalPrice =
Number(pendingReservation.total_price);



if(!finalPrice || finalPrice<=0){

alert("Montant invalide.");

return;

}



// Blocage bouton

btn.disabled=true;

btn.textContent=
"Validation du paiement...";



localStorage.setItem(
"payment_pending",
"true"
);



pendingReservation.telephone_client=phone;

pendingReservation.mode_paiement="Mobile Money";



try{


const response =
await fetch(

"https://kfkifkstatbadtzosxai.supabase.co/functions/v1/process-payment",

{


method:"POST",

headers:{


"Content-Type":"application/json",

"Authorization":
`Bearer ${supabaseKey}`


},


body:
JSON.stringify(pendingReservation)


}

);



const result =
await response.json();



console.log(
"Résultat process-payment:",
result
);



// Paiement confirmé directement

if(
result.success &&
!result.transaction_id &&
!result.id
){


localStorage.removeItem(
"payment_pending"
);



pendingReservation.ticket_number =
result.ticket_number;


localStorage.setItem(
"reservationInfo",
JSON.stringify(pendingReservation)
);



window.location.href=
`confirmation.html?ticket=${result.ticket_number}`;


return;

}




// Paiement en attente

const txId =
result.transaction_id ||
result.id;



if(
result.success ||
result.pending ||
txId
){



btn.textContent=
"Confirmation sur votre téléphone...";



alert(
"Une demande de paiement a été envoyée.\n\nConfirmez avec votre code PIN."
);



startPaymentVerification(txId);



return;

}




// Refus

throw new Error(
result.message ||
"Paiement refusé"
);



}

catch(error){


console.error(
"Erreur paiement:",
error
);



localStorage.removeItem(
"payment_pending"
);



btn.disabled=false;

btn.textContent=
"Confirmer et payer 🔒";



alert(error.message);

}



});

// ===============================
// VERIFICATION DU PAIEMENT
// ===============================

async function startPaymentVerification(transactionId){


let attempts = 0;

const maxAttempts = 20; // 20 x 3 secondes = 1 minute

const btn = document.getElementById("payBtn");



const interval = setInterval(async()=>{


attempts++;


try{


const response = await fetch(

"https://kfkifkstatbadtzosxai.supabase.co/functions/v1/shewary-callback",

{

method:"POST",

headers:{

"Content-Type":"application/json",

"Authorization":
`Bearer ${supabaseKey}`

},

body:JSON.stringify({

transaction_id:transactionId

})

}

);



const result =
await response.json();



console.log(
"Résultat shewary-callback:",
result
);



// =====================
// PAIEMENT REUSSI
// =====================


if(

result.status==="completed" ||

result.status==="success" ||

result.status==="SUCCESS"

){


clearInterval(interval);


localStorage.removeItem(
"payment_pending"
);



pendingReservation.ticket_number =
result.ticket_number;



localStorage.setItem(

"reservationInfo",

JSON.stringify(pendingReservation)

);



window.location.href =
`confirmation.html?ticket=${result.ticket_number}`;


return;

}




// =====================
// PAIEMENT REFUSE
// =====================


if(

result.status==="failed" ||

result.status==="cancelled" ||

result.status==="FAILED" ||

result.status==="CANCELLED"

){


clearInterval(interval);



localStorage.removeItem(
"payment_pending"
);



btn.disabled=false;


btn.textContent=
"Confirmer et payer 🔒";



alert(

"Paiement échoué : "+

(result.message ||

"Transaction annulée.")

);



return;

}




// =====================
// TOUJOURS EN ATTENTE
// =====================


if(

result.status==="pending" ||

result.status==="PENDING"

){


console.log(
"Paiement toujours en attente..."
);

}



// Statut inconnu

else{


console.log(
"Statut reçu inconnu :",
result
);


}




// =====================
// EXPIRATION
// =====================


if(attempts>=maxAttempts){


clearInterval(interval);



localStorage.removeItem(
"payment_pending"
);



btn.disabled=false;


btn.textContent=
"Confirmer et payer 🔒";



alert(

"Le délai de confirmation est dépassé. Vous pouvez réessayer."

);



}



}


catch(error){


console.log(
"Erreur vérification paiement:",
error
);



if(attempts>=maxAttempts){


clearInterval(interval);



localStorage.removeItem(
"payment_pending"
);



btn.disabled=false;


btn.textContent=
"Confirmer et payer 🔒";


alert(
"Impossible de vérifier le paiement. Réessayez."
);


}


}



},3000);


}

</script>

</body>
</html>
